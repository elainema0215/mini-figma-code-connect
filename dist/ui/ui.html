<div id="app">
  <header>
    <div class="title">Simple Code Connect</div>
    <div class="header-actions">
      <button id="scan" class="ghost" type="button">扫描页面</button>
      <button id="refresh" class="ghost" type="button">重新读取</button>
    </div>
  </header>
  <div id="body"></div>
  <footer>
    <button id="export-schema" type="button">导出 schema.json</button>
    <button id="export-mapping-table" class="ghost" type="button">下载 mapping-table.json</button>
  </footer>
</div>
<style>
  :root {
    --bg: var(--figma-color-bg, #fff);
    --fg: var(--figma-color-text, #1a1a1a);
    --dim: var(--figma-color-text-secondary, #767676);
    --line: var(--figma-color-border, #e6e6e6);
    --panel: var(--figma-color-bg-secondary, #f5f5f5);
    --accent: var(--figma-color-text-brand, #0d99ff);
    --danger: var(--figma-color-text-danger, #d93025);
    --warn: var(--figma-color-text-warning, #a06b00);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 10px/1.4 Inter, -apple-system, "Segoe UI", sans-serif;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; border-bottom: 1px solid var(--line); flex: none;
  }
  .title { font-weight: 600; font-size: 12px; }
  .header-actions { display: flex; gap: 6px; }
  #body { flex: 1; overflow-y: auto; padding: 12px; }
  footer {
    display: flex; gap: 8px; padding: 10px 12px;
    border-top: 1px solid var(--line); flex: none;
  }
  button {
    font: inherit; font-weight: 500; padding: 6px 10px; border-radius: 6px;
    border: 1px solid transparent; background: var(--accent); color: #fff; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
  button:disabled { opacity: .4; cursor: default; }
  h2 {
    font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--dim); margin: 0 0 6px;
  }
  section { margin-bottom: 16px; }
  .hint { color: var(--dim); }
  .card { background: var(--panel); border-radius: 6px; padding: 10px; }
  .kv { display: flex; gap: 8px; margin-bottom: 3px; }
  .kv span:first-child { color: var(--dim); min-width: 86px; flex: none; }
  .kv span:last-child { word-break: break-all; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-weight: 500; font-size: 9px; text-transform: uppercase; letter-spacing: .04em; }
  td { font-size: 10px; }
  code, pre { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 10px; }
  td code {
    padding: 1px 5px; border-radius: 3px; background: var(--panel);
    color: var(--accent); font-size: 9px;
  }
  pre {
    margin: 0; padding: 10px; background: var(--panel); border-radius: 6px;
    overflow-x: auto; white-space: pre;
  }
  .tag {
    display: inline-block; padding: 0 5px; border-radius: 4px; font-size: 10px;
    background: var(--line); color: var(--fg);
  }
  .tag.ok { background: rgba(13,153,255,.16); color: var(--accent); }
  .tag.miss { background: rgba(217,48,37,.14); color: var(--danger); }
  ul.candidates { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  ul.candidates button { width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center; }
  .dim { color: var(--dim); }
  .scan-search {
    width: 100%; box-sizing: border-box; margin: 8px 0 10px; padding: 6px 8px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--panel);
    color: var(--fg); font: inherit;
  }
  .component-list { border: 1px solid var(--line); border-radius: 8px; overflow: clip; }
  .list-header {
    display: flex; justify-content: space-between; padding: 6px 10px;
    background: var(--panel); font-size: 10px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--dim);
  }
  ul.component-rows { list-style: none; margin: 0; padding: 0; }
  .component-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 7px 10px; border-top: 1px solid var(--line);
  }
  .component-row .row-name {
    background: none; border: none; color: var(--fg); padding: 0; cursor: pointer;
    display: flex; align-items: center; gap: 6px; text-align: left; font: inherit; min-width: 0;
  }
  .component-row .row-name span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .diamond { color: var(--accent); font-size: 9px; flex: none; }
  .row-code { display: flex; align-items: center; gap: 5px; flex: none; white-space: nowrap; }
  .status-dot { display: inline-flex; width: 14px; height: 14px; border-radius: 50%; align-items: center; justify-content: center; font-size: 9px; flex: none; }
  .status-dot.ok { background: rgba(13,153,255,.16); color: var(--accent); }
  .status-dot.miss { background: rgba(217,48,37,.14); color: var(--danger); }
  ul.findings { margin: 0; padding-left: 16px; }
  ul.findings li { margin-bottom: 3px; }
  li.error { color: var(--danger); }
  li.warn { color: var(--warn); }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .copy { font-size: 10px; padding: 2px 7px; }
</style>
<script>/*__UI_JS__*/</script>
